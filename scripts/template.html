<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
{{FONT_LINKS}}
<style>
  {{FONT_FACE}}
  :root {
    --accent: {{ACCENT}}; --accent2: {{ACCENT2}}; --bg: {{BG}}; --text: {{TEXT}}; --on-accent: {{ON_ACCENT}}; --kw: {{KEYWORD_COLOR}};
    --w: {{W}}px; --h: {{H}}px; --pad: {{MARGIN}}px; --ts: {{TITLE_SIZE}}; --radius: {{RADIUS}}px; --s: {{SCALE}}; --track: {{TRACKING}}em;
    --tfont: {{TITLE_FONT}}; --tweight: {{TITLE_WEIGHT}}; --cov: {{COVER_IMAGE}};
    --sub: color-mix(in srgb, var(--text) 76%, transparent);
    --card: {{CARD_BG}}; --card-text: {{CARD_TEXT}};
    --line: color-mix(in srgb, var(--text) 14%, transparent);
    --grad: linear-gradient(90deg, var(--accent), var(--accent2));
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: var(--w); height: var(--h); overflow: hidden; background: var(--bg); }
  body { color: var(--text); font-family: {{BODY_FONT}}; word-break: keep-all; overflow-wrap: anywhere; letter-spacing: -0.02em; }

  .frame { position: relative; width: var(--w); height: var(--h); padding: 96px var(--pad) 150px; display: flex; flex-direction: column; justify-content: center; gap: calc(44px * var(--s)); }
  body.story .frame { padding: 280px var(--pad) 380px; }
  body.valign-top .frame { justify-content: flex-start; padding-top: 110px; }
  body.valign-bottom .frame { justify-content: flex-end; }
  body.align-center .frame { text-align: center; align-items: center; }
  body.align-center ol, body.align-center .compare { width: 100%; text-align: left; }
  body.foot-none .frame { padding-bottom: 100px; }
  .frame > * { position: relative; }

  /* 배경 무늬 */
  .pattern { position: absolute; inset: 0; pointer-events: none; }
  body.pat-glow .pattern { background: radial-gradient(900px 700px at 85% 0%, color-mix(in srgb, var(--accent) 16%, transparent), transparent 70%); }
  body.pat-grid .pattern { background-image: linear-gradient(color-mix(in srgb, var(--text) 20%, transparent) 2px, transparent 2px), linear-gradient(90deg, color-mix(in srgb, var(--text) 20%, transparent) 2px, transparent 2px); background-size: 163px 163px; background-position: -32px -60px; }
  body.pat-dots .pattern { background-image: radial-gradient(color-mix(in srgb, var(--text) 22%, transparent) 3px, transparent 3.5px); background-size: 54px 54px; }
  body.has-bg .pattern { display: none; }

  /* 글자 */
  h1, blockquote, .kwline { font-family: var(--tfont); font-weight: var(--tweight); letter-spacing: var(--track); }
  h1 { font-size: calc(84px * var(--s) * var(--ts)); line-height: 1.22; }
  h1, blockquote, .body, .sub { text-wrap: balance; }
  .sub { font-size: calc(48px * var(--s)); line-height: 1.4; font-weight: 700; margin-top: calc(-14px * var(--s)); }
  .body { font-size: calc(42px * var(--s)); line-height: 1.55; font-weight: 500; color: var(--sub); }
  body.cover h1 { font-size: calc(100px * var(--s)); line-height: 1.18; }
  body.cover .body { font-size: calc(46px * var(--s)); }

  /* 강조 (*별표*) */
  em { font-style: normal; color: var(--accent); }
  .gradtext, body.em-gradient em,
  body.title-gradient:not(.cover):not(.cta) h1 { background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; -webkit-text-fill-color: transparent; -webkit-box-decoration-break: clone; box-decoration-break: clone; }
  body.title-accent:not(.cover):not(.cta) h1 { color: var(--accent); }
  body.title-accent:not(.cover):not(.cta) h1 em { color: var(--text); }
  body.em-highlight em { color: inherit; background: linear-gradient(transparent 58%, color-mix(in srgb, var(--accent) 45%, transparent) 58%); }
  body.em-box em { color: var(--on-accent); background: var(--accent); padding: 0 .14em; border-radius: calc(var(--radius) * .35); -webkit-box-decoration-break: clone; box-decoration-break: clone; }
  body.em-underline em { color: inherit; text-decoration: underline; text-decoration-color: var(--accent); text-decoration-thickness: .09em; text-underline-offset: .14em; }

  /* 머리말 */
  .kicker { font-size: calc(34px * var(--s)); font-weight: 700; color: var(--accent); letter-spacing: 0; }
  body.kicker-pill .kicker, body.kicker-soft .kicker, body.kicker-outline .kicker { align-self: flex-start; padding: 8px 24px; border-radius: 999px; font-size: calc(30px * var(--s)); }
  body.align-center.kicker-pill .kicker, body.align-center.kicker-soft .kicker, body.align-center.kicker-outline .kicker { align-self: center; }
  body.kicker-pill .kicker { background: var(--accent); color: var(--on-accent); }
  body.kicker-soft .kicker { background: color-mix(in srgb, var(--accent) 14%, var(--bg)); border-radius: 12px; }
  body.kicker-outline .kicker { border: 3px solid var(--accent); }
  body.kicker-line .kicker { display: flex; align-items: center; gap: 20px; font-size: calc(30px * var(--s)); letter-spacing: .08em; align-self: stretch; }
  body.kicker-line .kicker::after { content: ""; flex: 1; height: 2px; background: currentColor; opacity: .45; }
  /* 표지 태그: 오른쪽 위 알약 */
  .tag { position: absolute !important; top: 60px; right: 60px; font-size: calc(34px * var(--s)); font-weight: 800; padding: 16px 32px; border-radius: 999px; border: 4px solid transparent;
         background: linear-gradient(color-mix(in srgb, var(--bg) 88%, var(--accent)), color-mix(in srgb, var(--bg) 88%, var(--accent))) padding-box, var(--grad) border-box; }
  .tag span { background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; -webkit-text-fill-color: transparent; }

  .swipe { font-size: calc(34px * var(--s)); font-weight: 700; color: var(--on-accent); background: var(--accent); align-self: flex-start; padding: 16px 30px; border-radius: 999px; }
  body.align-center .swipe { align-self: center; }
  body.swipe-outline .swipe { background: transparent; color: var(--text); border: 2px solid var(--text); }
  .divider { align-self: stretch; height: 3px; background: color-mix(in srgb, var(--text) 45%, transparent); margin-top: calc(20px * var(--s)); }
  .chandle { font-size: calc(46px * var(--s)); font-weight: 500; padding-left: 44px; margin-top: calc(-8px * var(--s)); }
  body.align-center .chandle { padding-left: 0; }

  /* 목록 */
  ol { list-style: none; display: flex; flex-direction: column; gap: calc(26px * var(--s)); }
  ol li { display: flex; gap: 26px; align-items: flex-start; font-size: calc(42px * var(--s)); line-height: 1.45; font-weight: 600; background: var(--card); color: var(--card-text); border: 2px solid var(--line); border-radius: var(--radius); padding: 30px 34px; }
  ol .n { flex: none; width: 60px; height: 60px; border-radius: 50%; background: var(--accent); color: var(--on-accent); font-size: 32px; font-weight: 800; display: flex; align-items: center; justify-content: center; }
  body.item-line ol { gap: 0; }
  body.item-line ol li { background: transparent; border: 0; border-top: 2px solid var(--line); border-radius: 0; padding: 30px 4px; }
  body.item-line ol li:last-child { border-bottom: 2px solid var(--line); }
  body.item-plain ol { gap: calc(18px * var(--s)); padding-left: 56px; margin-top: calc(36px * var(--s)); }
  body.item-plain ol li { background: transparent; border: 0; border-radius: 0; padding: 4px 0; font-weight: 700; gap: 20px; }
  body.item-fill ol li { border: 0; }
  body.item-shadow ol li, body.item-shadow .col { border: 5px solid var(--text); box-shadow: 10px 10px 0 var(--text); }
  body.item-shadow .shot, body.item-shadow.cover-framed.cover .bgimg, body.item-shadow .keyword { border: 5px solid var(--text); box-shadow: 12px 12px 0 var(--text); }
  body.num-outline ol.steps .n { background: transparent; color: var(--accent); border: 3px solid var(--accent); }
  body.num-plain ol.steps .n { background: transparent; color: var(--accent); width: auto; height: auto; font-size: 1.15em; line-height: 1.25; font-family: var(--tfont); font-weight: var(--tweight); }
  body.num-plain ol.steps .n::after { content: "."; }
  ol.bullets .n { width: 18px; height: 18px; margin-top: calc(.725em - 9px); font-size: inherit; color: transparent; overflow: hidden; }
  body.bullet-square ol.bullets .n { border-radius: 3px; width: 30px; height: 30px; margin-top: calc(.725em - 15px); background: var(--card-text); }
  body.bullet-dash ol.bullets .n { border-radius: 2px; width: 30px; height: 6px; margin-top: calc(.725em - 3px); }
  body.bullet-check ol.bullets .n::before { content: "✓"; }
  body.bullet-check ol.bullets .n { background: transparent; width: auto; height: auto; margin-top: 0; font-size: 0; overflow: visible; }
  body.bullet-check ol.bullets .n::before { font-size: calc(44px * var(--s)); font-weight: 900; line-height: 1.4; color: var(--accent); }

  .compare { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; align-self: stretch; }
  .col { border-radius: var(--radius); padding: 34px 32px; border: 2px solid var(--line); background: var(--card); color: var(--card-text); }
  .col.right { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 14%, var(--bg)); color: var(--text); }
  body.item-shadow .col.right { background: var(--text); color: var(--bg); }
  .col .label { font-size: calc(34px * var(--s)); font-weight: 800; margin-bottom: 22px; }
  .col.right .label { color: var(--accent); }
  body.item-shadow .col.right .label { color: inherit; }
  .col ul { list-style: none; display: flex; flex-direction: column; gap: 18px; font-size: calc(36px * var(--s)); line-height: 1.4; font-weight: 500; }

  blockquote { font-size: calc(80px * var(--s)); line-height: 1.3; border-left: 12px solid var(--accent); padding-left: 44px; }
  body.quote-mark blockquote, body.quote-plain blockquote { border-left: 0; padding-left: 0; }
  body.quote-mark blockquote::before { content: "“"; display: block; font-size: 180px; line-height: .8; color: var(--accent); }
  body.align-center blockquote { border-left: 0; padding-left: 0; }

  /* 마지막 장 */
  body.cta .frame { text-align: center; align-items: center; justify-content: center; }
  body.cta h1 { font-size: calc(76px * var(--s)); }
  .keyword { align-self: stretch; border: 4px solid var(--accent); border-radius: calc(var(--radius) + 8px); padding: 44px 40px; display: flex; flex-direction: column; gap: 10px; background: color-mix(in srgb, var(--bg) 80%, transparent); }
  .keyword span { font-size: calc(38px * var(--s)); font-weight: 600; color: var(--accent); }
  .keyword strong { font-size: calc(130px * var(--s)); line-height: 1.1; font-weight: 900; color: var(--accent); }
  .icon { width: 150px; height: 150px; border-radius: 50%; border: 5px solid transparent; background: linear-gradient(var(--bg), var(--bg)) padding-box, var(--grad) border-box; display: flex; align-items: center; justify-content: center; margin-bottom: calc(60px * var(--s)); }
  .icon svg { width: 72px; height: 72px; fill: var(--text); }
  .kwline { font-size: calc(72px * var(--s)); line-height: 1.1; color: var(--kw); margin-bottom: calc(-36px * var(--s)); }
  body.cta.cta-button h1 { font-size: calc(60px * var(--s)); line-height: 1.22; }
  body.cta.cta-button .body { color: var(--text); font-weight: 600; font-size: calc(36px * var(--s)); margin-top: calc(10px * var(--s)); }
  .btn { align-self: stretch; margin: calc(-22px * var(--s)) 90px 0; padding: 26px 30px; border-radius: 999px; background: var(--grad); color: var(--on-accent); font-size: calc(36px * var(--s)); font-weight: 800; }
  .sign { display: flex; flex-direction: column; gap: 14px; margin-top: calc(70px * var(--s)); }
  .sign b { font-size: calc(40px * var(--s)); font-weight: 500; }
  .sign i { font-style: normal; font-size: calc(30px * var(--s)); color: color-mix(in srgb, var(--text) 58%, transparent); }

  /* 영상 장면 */
  .bgimg { position: absolute; left: 0; top: 0; width: 100%; height: calc(var(--h) * var(--cov)); object-fit: cover; object-position: center {{IMGPOS}}; }
  .shade { position: absolute; left: 0; top: 0; width: 100%; height: calc(var(--h) * var(--cov) + 2px); background: linear-gradient(180deg, transparent 0%, color-mix(in srgb, var(--bg) 6%, transparent) 40%, color-mix(in srgb, var(--bg) 86%, transparent) 70%, var(--bg) 86%, var(--bg) 100%); }
  body.has-bg .frame { justify-content: flex-end; padding-bottom: 160px; gap: calc(34px * var(--s)); }
  body.has-bg.foot-none .frame { padding-bottom: 110px; }
  /* 전체 화면 장면 */
  body.bg-full .bgimg { height: 100%; }
  body.bg-full .shade { height: 100%; background: linear-gradient(180deg, rgba(0,0,0,.10) 0%, rgba(0,0,0,.18) 35%, rgba(0,0,0,.80) 62%, rgba(0,0,0,.94) 100%); }
  body.bg-full h1, body.bg-full .body, body.bg-full .sub { color: #fff; text-shadow: 0 4px 24px rgba(0,0,0,.6); }
  body.bg-full ol li, body.bg-full .col { background: rgba(0,0,0,.45); color: #fff; border-color: rgba(255,255,255,.22); backdrop-filter: blur(10px); }
  /* 액자형 표지 */
  body.bg-framed .bgimg { top: var(--pad); left: var(--pad); width: calc(100% - var(--pad) * 2); height: calc(var(--h) * 0.46); border-radius: var(--radius); }
  body.bg-framed .shade { display: none; }
  body.bg-framed .frame { justify-content: flex-start; padding-top: calc(var(--h) * 0.46 + 130px); padding-bottom: 150px; }
  body.bg-framed .tag { top: 112px; right: 112px; }
  /* 본문 위 사진 칸 */
  .shot { flex: none; align-self: stretch; height: 500px; border-radius: var(--radius); overflow: hidden; border: 2px solid var(--line); }
  .shot img { width: 100%; height: 100%; object-fit: cover; object-position: center {{IMGPOS}}; display: block; }
  body.has-shot .frame { gap: calc(36px * var(--s)); padding-top: 80px; }
  body.has-shot h1 { font-size: calc(72px * var(--s) * var(--ts)); }

  .foot { position: absolute; left: var(--pad); right: var(--pad); bottom: 64px; display: flex; align-items: center; justify-content: space-between; font-size: 28px; font-weight: 600; color: color-mix(in srgb, var(--text) 55%, transparent); }
  body.story .foot { bottom: 300px; }
  body.foot-none .foot, body.cta-button.cta .foot { display: none; }
  body.foot-dots .foot > :not(.dots), body.foot-page .foot > .dots, body.foot-page .foot > .fh, body.foot-handle .foot > :not(.fh) { visibility: hidden; }
  body.foot-dots .foot { justify-content: center; }
  .dots { display: flex; gap: 10px; }
  .dots i { width: 12px; height: 12px; border-radius: 50%; background: color-mix(in srgb, var(--text) 25%, transparent); }
  .dots i.on { width: 34px; border-radius: 6px; background: var(--accent); }
</style>
</head>
<body class="{{FORMAT}} {{TYPE}} {{CLASSES}}">
  {{BGIMAGE}}
  <div class="pattern"></div>
  <div class="frame" id="frame">{{CONTENT}}</div>
  <div class="foot"><span class="fh">{{HANDLE}}</span><span class="dots">{{DOTS}}</span><span class="fp">{{PAGE}}</span></div>
<script>
  // 내용이 넘치면 글자를 줄여 화면 안에 맞춘다.
  function fit() {
    var frame = document.getElementById('frame');
    var cs = getComputedStyle(frame);
    var room = frame.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
    var kids = [].slice.call(frame.children).filter(function (k) { return getComputedStyle(k).position !== 'absolute'; });
    var used = function () {
      var gap = parseFloat(cs.rowGap) || 0, h = 0;
      kids.forEach(function (k) { var m = getComputedStyle(k); h += k.offsetHeight + (parseFloat(m.marginTop) || 0) + (parseFloat(m.marginBottom) || 0); });
      return h + gap * Math.max(0, kids.length - 1);
    };
    var wide = function () { return frame.scrollWidth > frame.clientWidth + 1; };
    var els = [].slice.call(frame.querySelectorAll('h1, blockquote, .body, .sub, li, .keyword strong, .col .label, .col ul, .kwline, .btn'));
    var guard = 0;
    var shot = frame.querySelector('.shot');
    while ((used() > room || wide()) && guard++ < 40) {
      if (shot && shot.offsetHeight > 300) shot.style.height = (shot.offsetHeight * 0.92) + 'px';
      els.forEach(function (el) {
        var fs = parseFloat(getComputedStyle(el).fontSize);
        if (fs > 26) el.style.fontSize = (fs * 0.95) + 'px';
      });
    }
    document.title = (used() > room || wide()) ? 'OVERFLOW' : 'OK';
  }
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit); else window.onload = fit;
  window.addEventListener('load', fit);
</script>
</body>
</html>
